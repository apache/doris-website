github:
  description: Apache Doris Website
  homepage: https://doris.apache.org/
  labels:
    - data-warehousing
    - mpp
    - olap
    - dbms
    - apache
    - doris
    - database
    - distributed-system
    - big-data
    - iceberg
    - hudi
    - datalake
    - hive
    - hadoop
    - analytics
    - tpch
    - ssb
    - vectorized
  enabled_merge_buttons:
    squash:  true
    merge:   false
    rebase:  false
  # Opt in to the immutable, ID-based OIDC subject claim. The default claim
  # repo:apache/doris-website:ref:refs/heads/master becomes
  # repo:apache@47359/doris-website@149782046:ref:refs/heads/master.
  oidc_subject:
    use_immutable_subject: true
  pull_requests:
    allow_update_branch: true   
    del_branch_on_merge: true
    creation_cap:
      # Limit concurrent open PRs from users without write access (fork PRs).
      enabled: true
      max_open_pull_requests: 20
      include_drafts: true
  protected_branches:
    master:
      required_status_checks:
        # if strict is true, means "Require branches to be up to date before merging".
        strict: false
        contexts:
          - Build Check
          - check-md-links
          - check-file-sizes
      required_pull_request_reviews:
        # Require at least one approving review before a PR can be merged into
        # master. Only reviewers with write access (committers) count.
        required_approving_review_count: 1
        # A new commit dismisses earlier approvals, and the latest push must be
        # approved again, so an approved clean revision cannot be replaced by a
        # later unreviewed one.
        dismiss_stale_reviews: true
        require_last_push_approval: true
  features:
    issues: true
    wiki: false
    projects: false
    discussions: false

  dependabot_alerts: true
  dependabot_updates: true

  # Explicit empty list: removing the key entirely would not clear collaborators
  # that a previously applied .asf.yaml had configured.
  collaborators: []

notifications:
    commits:              commits@doris.apache.org
    issues:               commits@doris.apache.org
    pullrequests_comment: commits@doris.apache.org
    pullrequests_status:  commits@doris.apache.org
