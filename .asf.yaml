github:
  description: Apache Doris Website
  homepage: https://doris.apache.org/
  labels:
    - data-warehousing
    - mpp
    - olap
    - dbms
    - apache
    - doris
    - database
    - distributed-system
    - big-data
    - iceberg
    - hudi
    - datalake
    - hive
    - hadoop
    - analytics
    - tpch
    - ssb
    - vectorized
  rulesets:
    - name: "Protect asf-site"
      type: branch
      branches:
        includes:
          - "asf-site"
        excludes: []
      # The deploy force-pushes this branch with force_orphan, so the
      # non-fast-forward rule would break publishing. Only block deletion;
      # full force-push protection needs a bypass identity (custom App or
      # deploy key) because the built-in Actions app cannot be a bypass actor.
      restrict_deletion: true
      restrict_force_push: false

    - name: Master branch protection
      type: branch
      branches:
        includes:
          - master
      restrict_deletion: true
      restrict_force_push: true
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_last_push_approval: true
      required_status_checks_strict: false
      required_status_checks:
        - name: Build Check
          app_slug: github-actions
        - name: check-md-links
          app_slug: github-actions
        - name: check-file-sizes
          app_slug: github-actions
  enabled_merge_buttons:
    squash:  true
    merge:   false
    rebase:  false
  # Opt in to the immutable, ID-based OIDC subject claim. The default claim
  # repo:apache/doris-website:ref:refs/heads/master becomes
  # repo:apache@47359/doris-website@149782046:ref:refs/heads/master.
  oidc_subject:
    use_immutable_subject: true
  pull_requests:
    allow_update_branch: true   
    del_branch_on_merge: true
    creation_cap:
      # Limit concurrent open PRs from users without write access (fork PRs).
      enabled: true
      max_open_pull_requests: 20
      include_drafts: true
  features:
    issues: true
    wiki: false
    projects: false
    discussions: false

  dependabot_alerts: true
  dependabot_updates: true

  # Explicit empty list: removing the key entirely would not clear collaborators
  # that a previously applied .asf.yaml had configured.
  collaborators: []

notifications:
    commits:              commits@doris.apache.org
    issues:               commits@doris.apache.org
    pullrequests_comment: commits@doris.apache.org
    pullrequests_status:  commits@doris.apache.org
