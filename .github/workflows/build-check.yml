---
name: Build Check

on:
    pull_request:
        types: [opened, synchronize, reopened, labeled, unlabeled]
    workflow_dispatch:
        inputs:
            validation:
                description: Validation scope
                type: choice
                options: [full, sample]
                default: full

concurrency:
    group: build-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
  contents: read

jobs:
    build-and-deploy:
        name: Build Check
        runs-on: ubuntu-22.04
        env:
            BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        steps:
            - name: Checkout PR merge commit (${{ github.sha }})
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                # Match the workflow's merge snapshot, including new base-branch tooling.
                ref: ${{ github.sha }}
                persist-credentials: false
                fetch-depth: 0
                # Full history is needed for merge-base/check_move, but the
                # object database is ~1.7GB. Trees and commits are enough;
                # checkout fetches the blobs the working tree needs.
                filter: blob:none

            - name: Set up Python
              uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
              with:
                python-version: '3.12'

            - name: Use Node.js
              uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
              with:
                  node-version: 20
                  cache: yarn
            
            - name: Refactor PR commits and check move
              run: |
                git config --global user.email "gha@apache.org"
                git config --global user.name "github-action-test"
          
                # Get the base commit of the PR
                BASE_COMMIT=$(git merge-base "origin/$BASE_REF" HEAD)
    
                # Run the Python script with the base commit range
                python check_move.py "$BASE_COMMIT"
                  
            
            - name: Run Node.js dead link checker
              run: |
                BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
                node ./scripts/check_move.js --base "$BASE_SHA"
        
            - name: Detect changed doc versions and locales
              id: detect
              run: |
                BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
                node scripts/i18n/check-configuration.cjs --all
                node scripts/i18n/build-scope.cjs "$BASE_SHA"
                node scripts/i18n/ci-plan.cjs "$BASE_SHA"

            - name: Prepare swap for the localized build
              if: steps.detect.outputs.validation_mode == 'full' || steps.detect.outputs.validation_mode == 'sample'
              run: |
                  sudo fallocate -l 8G /mnt/japanese-build-check-swap
                  sudo chmod 600 /mnt/japanese-build-check-swap
                  sudo mkswap /mnt/japanese-build-check-swap
                  sudo swapon /mnt/japanese-build-check-swap

            # Fixture validation also needs dependencies; prose-only changes do not.
            - name: Install dependencies
              id: install
              if: steps.detect.outputs.validation_mode != 'skip'
              env:
                  NODE_OPTIONS: --max-old-space-size=8192
              run: |
                  npm install -g yarn
                  yarn --frozen-lockfile
                  yarn key-features:generate

            - name: Validate manual content and shared messages
              if: steps.detect.outputs.validation_mode != 'skip'
              run: |
                  node scripts/i18n/check-configuration.cjs --all --release-history
                  node scripts/i18n/manual-report.cjs
                  node scripts/i18n/check-blog-translations.cjs

            - name: Translation unit tests
              env:
                  NODE_OPTIONS: --max-old-space-size=8192
              if: steps.detect.outputs.translation_tests == 'true'
              run: node --test scripts/i18n/__tests__/*.test.cjs

            - name: Publish artifact optimization tests
              if: steps.detect.outputs.publish_fixture == 'true'
              env:
                  NODE_OPTIONS: --max-old-space-size=2048
                  DORIS_TEST_APACHE: "true"
              run: |
                  node --test scripts/publish/__tests__/*.test.cjs
                  node scripts/publish/verify-fixture.cjs

            - name: Verify isolated compiler outputs
              if: steps.detect.outputs.compiler_fixture == 'true'
              run: node scripts/i18n/verify-compiler-fixture.cjs

            - name: Verify native content manifest fixture
              if: steps.detect.outputs.content_fixture == 'true'
              run: |
                  node scripts/i18n/verify-content-fixture.cjs
                  node scripts/i18n/verify-blog-fixture.cjs
                  node scripts/i18n/verify-release-policy-fixture.cjs

            - name: Workflow security boundary tests
              run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

            - name: Translation gate for changed locales
              if: steps.detect.outputs.validation_mode != 'skip'
              run: |
                  BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
                  CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
                  # A shared input can change every locale's admission result;
                  # otherwise only locales whose own translation inputs changed
                  # need the full inventory load.
                  SHARED=false
                  if printf '%s\n' "$CHANGED" | grep -qE '^(scripts/i18n/|translations/config\.json$|config/i18n\.js$|docusaurus\.config\.js$|versions\.json$|sidebars[^/]*\.(ts|json)$|versioned_sidebars/)'; then
                      SHARED=true
                  fi
                  for LOCALE in $(node scripts/i18n/managed-locales.cjs --all); do
                      if [ "$SHARED" = true ] || printf '%s\n' "$CHANGED" | grep -qE "^i18n/$LOCALE/|^translations/(state|scope|glossary|inventory|protection-exceptions)/$LOCALE([/.]|$)"; then
                          I18N_LOCALE="$LOCALE" node scripts/i18n/pr-preflight.cjs --base "$BASE_SHA"
                      else
                          echo "No $LOCALE translation changes; skipping the admission gate for this locale."
                      fi
                  done

            - name: Install browser verification tools
              if: steps.detect.outputs.validation_mode == 'full' || steps.detect.outputs.validation_mode == 'sample' || steps.detect.outputs.publish_fixture == 'true' || steps.detect.outputs.content_fixture == 'true' || steps.detect.outputs.sampling_fixture == 'true' || steps.detect.outputs.search_fixture == 'true'
              run: |
                  DORIS_BROWSER_TOOLS="$RUNNER_TEMP/doris-browser-tools"
                  npm install --prefix "$DORIS_BROWSER_TOOLS" --no-save --no-package-lock playwright@1.64.1
                  "$DORIS_BROWSER_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
                  echo "NODE_PATH=$DORIS_BROWSER_TOOLS/node_modules" >> "$GITHUB_ENV"

            - name: Verify CI sampling adapter
              if: steps.detect.outputs.sampling_fixture == 'true'
              run: node scripts/i18n/verify-ci-sampling-fixture.cjs --browser

            - name: Verify search transport and recovery in Chromium
              if: steps.detect.outputs.search_fixture == 'true'
              run: node scripts/i18n/verify-search-transport.cjs --browser

            - name: Verify five-language publishing fixture in Chromium
              if: steps.detect.outputs.publish_fixture == 'true'
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
              run: node scripts/publish/verify-fixture.cjs --verify-existing --browser

            - name: Verify global language fixture in Chromium
              if: steps.detect.outputs.content_fixture == 'true'
              run: node scripts/i18n/verify-global-language.cjs --fixture --site .i18n-build/content-fixture/build --manifests .i18n-build/content-fixture/.i18n-build/content-manifests --output .i18n-build/browser-global-language-fixture.json
            - name: Verify release-note policy fixture in Chromium
              if: steps.detect.outputs.content_fixture == 'true'
              run: node scripts/i18n/verify-release-policy-fixture.cjs --verify-existing --browser

            - name: Verify automatic language entry in Chromium
              if: steps.detect.outputs.content_fixture == 'true'
              run: node scripts/i18n/verify-locale-entry-fixture.cjs

            - name: Build
              env:
                  DORIS_OPTIMIZE_PUBLISH: ${{ steps.detect.outputs.validation_mode == 'full' }}
                  DORIS_ASSET_ORIGIN: ""
                  DOCS_VERSIONS: ""
                  DORIS_ENABLE_LOCALES: ${{ steps.detect.outputs.validation_enabled_locales }}
                  PWA_SERVICE_WORKER_URL: https://doris.apache.org/sw.js
                  NODE_OPTIONS: --max-old-space-size=8192
              run: |
                  MODE="${{ steps.detect.outputs.validation_mode }}"
                  export DOCUSAURUS_PERF_LOGGER=true
                  if [ "$MODE" = "skip" ] || [ "$MODE" = "fixtures" ]; then
                      echo "No real-site build required: validation mode=$MODE"
                      exit 0
                  fi
                  mkdir -p .i18n-build
                  free -m > .i18n-build/ci-memory-before.txt
                  if [ "$MODE" = "sample" ]; then
                      /usr/bin/time -v -o .i18n-build/ci-build-time.txt node scripts/i18n/build-ci-sample.cjs
                  else
                      /usr/bin/time -v -o .i18n-build/ci-build-time.txt yarn build:publish --locales "${{ steps.detect.outputs.validation_locales }}"
                  fi
                  free -m > .i18n-build/ci-memory-after.txt

            - name: Report native translation coverage
              if: steps.detect.outputs.validation_mode == 'full' || steps.detect.outputs.validation_mode == 'sample'
              run: node scripts/i18n/manual-report.cjs --coverage

            - name: Verify sampled compilation
              if: steps.detect.outputs.validation_mode == 'sample'
              run: node scripts/i18n/verify-ci-sample.cjs

            - name: Verify localized static pages
              if: steps.detect.outputs.validation_mode == 'full'
              env:
                  NODE_OPTIONS: --max-old-space-size=8192
              run: |
                  for LOCALE in $(echo "${{ steps.detect.outputs.validation_enabled_locales }}" | tr ',' ' '); do
                      node scripts/i18n/verify-static.cjs --site build --manifest ".i18n-build/manifests/${LOCALE}.json"
                  done
                  if [ "${{ steps.detect.outputs.validation_mode }}" = "full" ]; then
                      node scripts/publish/verify.cjs build
                      node scripts/i18n/verify-global-language.cjs --site build --output .i18n-build/browser-global-language.json
                      node scripts/i18n/verify-first-release.cjs --site build --output .i18n-build/first-release.json
                      for LOCALE in $(echo "${{ steps.detect.outputs.validation_enabled_locales }}" | tr ',' ' '); do
                          node scripts/i18n/verify-doc-navigation.cjs --site build --locale "$LOCALE" --manifest ".i18n-build/manifests/${LOCALE}.json" --output ".i18n-build/browser-navigation-${LOCALE}.json"
                          EXTRA_ARGS=()
                          if [ "$LOCALE" = "ko" ] || [ "$LOCALE" = "ru" ]; then EXTRA_ARGS=(--themes); fi
                          # English/Chinese checks are identical across these runs;
                          # keep each target locale's own theme/responsive coverage.
                          if [ "$LOCALE" = "ru" ]; then EXTRA_ARGS+=(--source-locales "en,zh-CN"); fi
                          /usr/bin/time -v -o ".i18n-build/browser-search-${LOCALE}-time.txt" node scripts/i18n/verify-search.cjs --site build --locale "$LOCALE" --manifest ".i18n-build/manifests/${LOCALE}.json" --output ".i18n-build/browser-search-${LOCALE}.json" "${EXTRA_ARGS[@]}"
                      done
                  fi
                  rm -rf build

            - name: Upload publish artifact measurements
              if: always() && hashFiles('.i18n-build/ci-plan.json') != ''
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: publish-artifact-measurements
                  include-hidden-files: true
                  path: |
                      .i18n-build/ci-plan.json
                      .i18n-build/manual-drift.json
                      .i18n-build/coverage.json
                      .i18n-build/first-release.json
                      .i18n-build/home-*.png
                      .i18n-build/ci-sample/scopes/*.json
                      .i18n-build/ci-sample/verification.json
                      .i18n-build/ci-sampling-fixture-proof.json
                      .i18n-build/search-transport-verification.json
                      .i18n-build/compiler-fixture-verification.json
                      .i18n-build/compiler-metrics/*.json
                      .i18n-build/publish-result.json
                      .i18n-build/build-result.json
                      .i18n-build/content-fixture-verification.json
                      .i18n-build/content-manifests/*.sizes.json
                      .i18n-build/ci-*.txt
                      .i18n-build/browser-*-time.txt
                      .i18n-build/browser-*.json
                  if-no-files-found: error
                  retention-days: 14

            - name: Docs governance report
              if: always() && steps.install.outcome == 'success' && steps.detect.outputs.docs_report == 'true'
              continue-on-error: true
              run: |
                  yarn docs:lint:changed --output website-quality-governance/generated/docs-governance-report.json
