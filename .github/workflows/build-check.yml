---
name: Build Check

on:
    pull_request:

concurrency:
    group: build-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build-and-deploy:
        name: Build Check
        runs-on: ubuntu-latest
        environment: Production
        steps:
            - name: Checkout ${{ github.ref }} ( ${{ github.event.pull_request.head.sha }} )
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.head.sha }}
                fetch-depth: 0
                # Full history is needed for merge-base/check_move, but the
                # object database is ~1.7GB. Trees and commits are enough;
                # checkout fetches the blobs the working tree needs.
                filter: blob:none

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.9'

            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20
                  cache: yarn
            
            - name: Refactor PR commits and check move
              run: |
                git config --global user.email "gha@apache.org"
                git config --global user.name "github-action-test"
          
                # Get the base commit of the PR
                BASE_COMMIT=$(git merge-base origin/${{ github.base_ref }} HEAD)
    
                # Run the Python script with the base commit range
                python check_move.py $BASE_COMMIT
                  
            
            - name: Run Node.js dead link checker
              run: |
                node ./scripts/check_move.js `git rev-parse HEAD`
        
            - name: Check exit code
              run: |
                if [ $? -ne 0 ]; then
                    echo "Have detected not processed link changes, please fix them."
                    exit 1
                fi

            - name: Detect changed doc versions and locales
              id: detect
              run: |
                BASE_SHA=$(git merge-base origin/${{ github.base_ref }} HEAD)
                node scripts/i18n/check-configuration.cjs --all
                node scripts/i18n/build-scope.cjs "$BASE_SHA"

            - name: Prepare swap for the localized build
              if: steps.detect.outputs.enabled_locales != '' && steps.detect.outputs.skip_build != 'true'
              run: |
                  sudo fallocate -l 8G /mnt/japanese-build-check-swap
                  sudo chmod 600 /mnt/japanese-build-check-swap
                  sudo mkswap /mnt/japanese-build-check-swap
                  sudo swapon /mnt/japanese-build-check-swap

            # Dependencies are required even when the scoped site build is skipped.
            - name: Install dependencies
              env:
                  NODE_OPTIONS: --max-old-space-size=8192
              run: |
                  npm install -g yarn
                  yarn
                  yarn key-features:generate

            - name: Translation unit tests
              env:
                  NODE_OPTIONS: --max-old-space-size=8192
              run: |
                  node --test scripts/i18n/__tests__/t04.test.cjs
                  node --test scripts/i18n/__tests__/heading-ids.test.cjs
                  node --test scripts/i18n/__tests__/search-input.test.cjs
                  node --test scripts/i18n/__tests__/search-contexts.test.cjs
                  node --test scripts/i18n/__tests__/search-version.test.cjs
                  node --test scripts/i18n/__tests__/configuration.test.cjs
                  node --test scripts/i18n/__tests__/search-verification.test.cjs
                  node --test scripts/i18n/__tests__/korean-tokenizer.test.cjs
                  node --test scripts/i18n/__tests__/doc-navigation.test.cjs
                  node --test scripts/i18n/__tests__/marketing-pages.test.cjs
                  node --test scripts/i18n/__tests__/locale-registry.test.cjs
                  node --test scripts/i18n/__tests__/multi-locale.test.cjs
                  node --test scripts/i18n/__tests__/inventory.test.cjs
                  node --test scripts/i18n/__tests__/planner.test.cjs
                  node --test scripts/i18n/__tests__/translation-engine.test.cjs
                  node --test scripts/i18n/__tests__/korean-toolchain.test.cjs
                  node --test scripts/i18n/__tests__/korean-workflow.test.cjs
                  node --test scripts/i18n/__tests__/workflow.test.cjs
                  node --test scripts/i18n/__tests__/codex-adapter.test.cjs
                  node --test scripts/i18n/__tests__/translate-document.test.cjs
                  node --test scripts/i18n/__tests__/incremental-document.test.cjs

            - name: Translation gate for changed locales
              run: |
                  BASE_SHA=$(git merge-base origin/${{ github.base_ref }} HEAD)
                  CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
                  # A shared input can change every locale's admission result;
                  # otherwise only locales whose own translation inputs changed
                  # need the full inventory load.
                  SHARED=false
                  if printf '%s\n' "$CHANGED" | grep -qE '^(scripts/i18n/|translations/config\.json$|config/i18n\.js$|docusaurus\.config\.js$|versions\.json$|sidebars[^/]*\.(ts|json)$|versioned_sidebars/)'; then
                      SHARED=true
                  fi
                  for LOCALE in $(node scripts/i18n/managed-locales.cjs --all); do
                      if [ "$SHARED" = true ] || printf '%s\n' "$CHANGED" | grep -qE "^i18n/$LOCALE/|^translations/(state|scope|glossary|inventory|protection-exceptions)/$LOCALE([/.]|$)"; then
                          I18N_LOCALE="$LOCALE" node scripts/i18n/pr-preflight.cjs --base "$BASE_SHA"
                      else
                          echo "No $LOCALE translation changes; skipping the admission gate for this locale."
                      fi
                  done

            - name: Publish artifact optimization tests
              env:
                  NODE_OPTIONS: --max-old-space-size=2048
              run: |
                  node --test scripts/publish/__tests__/*.test.cjs
                  if [ "${{ steps.detect.outputs.optimize_publish }}" = "true" ]; then
                      node scripts/publish/verify-fixture.cjs
                  fi

            - name: Install browser verification tools
              if: steps.detect.outputs.optimize_publish == 'true'
              run: |
                  DORIS_BROWSER_TOOLS="$RUNNER_TEMP/doris-browser-tools"
                  npm install --prefix "$DORIS_BROWSER_TOOLS" --no-save --no-package-lock playwright@1.64.1
                  "$DORIS_BROWSER_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
                  echo "NODE_PATH=$DORIS_BROWSER_TOOLS/node_modules" >> "$GITHUB_ENV"

            - name: Verify four-language publishing fixture in Chromium
              if: steps.detect.outputs.optimize_publish == 'true'
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
              run: node scripts/publish/verify-fixture.cjs --verify-existing --browser

            - name: Build
              env:
                  DORIS_OPTIMIZE_PUBLISH: ${{ steps.detect.outputs.optimize_publish }}
                  DORIS_ASSET_ORIGIN: ""
                  DOCS_VERSIONS: ${{ steps.detect.outputs.docs_versions }}
                  DORIS_ENABLE_LOCALES: ${{ steps.detect.outputs.enabled_locales }}
                  PWA_SERVICE_WORKER_URL: https://doris.apache.org/sw.js
                  NODE_OPTIONS: --max-old-space-size=8192
              run: |
                  if [ "${{ steps.detect.outputs.skip_build }}" = "true" ]; then
                      echo "No site-affecting changes detected — skipping the docusaurus build."
                      exit 0
                  fi

                  echo "Building with DOCS_VERSIONS=${DOCS_VERSIONS:-all} LOCALES=${{ steps.detect.outputs.locale_csv }}"
                  mkdir -p .i18n-build
                  free -m > .i18n-build/ci-memory-before.txt
                  if [ "${{ steps.detect.outputs.optimize_publish }}" = "true" ]; then
                      /usr/bin/time -v -o .i18n-build/ci-build-time.txt yarn build:publish --locales "${{ steps.detect.outputs.locale_csv }}"
                  elif [ "${{ steps.detect.outputs.locale_count }}" = "1" ] && [ "${{ steps.detect.outputs.enabled_locales }}" = "" ]; then
                      PWA_SERVICE_WORKER_URL=https://doris.apache.org/sw.js yarn docusaurus build ${{ steps.detect.outputs.locale_args }}
                  else
                      # Every locale gets a separate Node process and its real prefix.
                      yarn build:locales --locales "${{ steps.detect.outputs.locale_csv }}"
                  fi
                  free -m > .i18n-build/ci-memory-after.txt

            - name: Verify localized static pages
              if: steps.detect.outputs.skip_build != 'true'
              env:
                  NODE_OPTIONS: --max-old-space-size=8192
              run: |
                  # A locale subset cannot prove cross-locale reciprocity.
                  VERIFY_PARTIAL=""
                  if [ "${{ steps.detect.outputs.partial_build }}" = "true" ]; then VERIFY_PARTIAL="--partial"; fi
                  for LOCALE in $(echo "${{ steps.detect.outputs.enabled_locales }}" | tr ',' ' '); do
                      node scripts/i18n/verify-static.cjs --site build --manifest ".i18n-build/manifests/${LOCALE}.json" $VERIFY_PARTIAL
                  done
                  if [ "${{ steps.detect.outputs.optimize_publish }}" = "true" ]; then
                      node scripts/publish/verify.cjs build
                      for LOCALE in $(echo "${{ steps.detect.outputs.enabled_locales }}" | tr ',' ' '); do
                          node scripts/i18n/verify-doc-navigation.cjs --site build --locale "$LOCALE" --manifest ".i18n-build/manifests/${LOCALE}.json" --output ".i18n-build/browser-navigation-${LOCALE}.json"
                          EXTRA_ARGS=""
                          if [ "$LOCALE" = "ko" ]; then EXTRA_ARGS="--source-locales en,zh-CN --themes"; fi
                          /usr/bin/time -v -o ".i18n-build/browser-search-${LOCALE}-time.txt" node scripts/i18n/verify-search.cjs --site build --locale "$LOCALE" --manifest ".i18n-build/manifests/${LOCALE}.json" --output ".i18n-build/browser-search-${LOCALE}.json" $EXTRA_ARGS
                      done
                  fi
                  rm -rf build

            - name: Upload publish artifact measurements
              if: always() && steps.detect.outputs.optimize_publish == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: publish-artifact-measurements
                  include-hidden-files: true
                  path: |
                      .i18n-build/publish-result.json
                      .i18n-build/build-result.json
                      .i18n-build/ci-*.txt
                      .i18n-build/browser-*-time.txt
                      .i18n-build/browser-*.json
                  if-no-files-found: error
                  retention-days: 14

            - name: Docs changed link gate
              continue-on-error: true
              run: |
                  # Report-only: the bulk-rename in the new-homepage launch PR
                  # exposes ~30 latent anchor/link issues that pre-date this
                  # change. They're being chipped away in follow-up PRs and
                  # should not block the launch. The full findings still write
                  # to the report file below for audit.
                  yarn docs:links:changed --output website-quality-governance/generated/docs-links-report.json

            - name: Docs governance report
              if: always()
              continue-on-error: true
              run: |
                  if [ ! -d node_modules ]; then
                      npm install -g yarn
                      yarn --frozen-lockfile || yarn
                  fi
                  yarn docs:lint:changed --output website-quality-governance/generated/docs-governance-report.json
