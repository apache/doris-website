name: Manual Deploy And Upload To OSS

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'Specify the branch name'
                required: true
                default: 'master'

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment: Production
        steps:
            - name: Checkout
              uses: actions/checkout@master
              with:
                  persist-credentials: false
                  submodules: recursive

            - name: Add Chinese Fonts
              run: |
                  sudo apt-get install ttf-mscorefonts-installer
                  sudo apt-get install fontconfig
                  fc-list :lang=zh
                  ls -lh /usr/share/fonts/
                  cp -rf ./static/fonts/* /usr/share/fonts/
                  mkfontscale
                  mkfontdir
                  fc-cache
                  fc-list :lang=zh

            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Add Swap Space
              run: |
                  sudo fallocate -l 8G /mnt/swapfile2
                  sudo chmod 600 /mnt/swapfile2
                  sudo mkswap /mnt/swapfile2
                  sudo swapon /mnt/swapfile2
                  free -h
                  swapon --show

            - name: Build
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  npm install -g yarn
                  yarn cache clean
                  export NODE_OPTIONS=--max-old-space-size=8192
                  yarn
                  node ./scripts/update_github_info.js
                  yarn key-features:generate
                  PWA_SERVICE_WORKER_URL=https://doris.apache.org/sw.js yarn docusaurus build --locale en --locale zh-CN
                  touch build/.dummy
                  cp .asf-site.yaml ./build/.asf.yaml
                  cp versions.json ./build/
                  ls build
                  export DORIS_COMMIT=`git rev-parse HEAD`

            - name: Upload files to OSS
              id: oss-upload
              # Same retry as cron-deploy-website.yml: the action has no
              # per-request retry, one timed-out PUT fails the step, and the
              # .actioninfo manifest it writes before exiting lets a second run
              # re-send only what failed.
              continue-on-error: true
              uses: ./.github/actions/aliyun-oss-website-action
              with:
                  accessKeyId: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
                  accessKeySecret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
                  bucket: ${{ secrets.ALIYUN_OSS_BUCKET }}
                  # Transfer-acceleration endpoint of the website bucket (enabled
                  # on the bucket on 2026-09-21): the runner enters Alibaba's
                  # backbone at the nearest PoP instead of crossing the public
                  # internet to the bucket's region. Uploads only - the CDN keeps
                  # its regional origin for downloads.
                  endpoint: oss-accelerate.aliyuncs.com
                  folder: build
                  onlyUpload: true
                  otherCacheControl: 0
                  skipSetting: true

            - name: Upload files to OSS (retry)
              if: steps.oss-upload.outcome == 'failure'
              uses: ./.github/actions/aliyun-oss-website-action
              with:
                  accessKeyId: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
                  accessKeySecret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
                  bucket: ${{ secrets.ALIYUN_OSS_BUCKET }}
                  endpoint: oss-accelerate.aliyuncs.com
                  folder: build
                  onlyUpload: true
                  otherCacheControl: 0
                  skipSetting: true

            - name: Deploy Website
              if: ${{ github.event.inputs.branch == 'master' }}
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ github.token }}
                  publish_branch: asf-site
                  force_orphan: true
                  publish_dir: ./build
                  destination_dir: ./
                  user_name: 'github-actions[bot]'
                  user_email: 'github-actions[bot]@users.noreply.github.com'
                  commit_message: 'Automated deployment with doris branch ${{ github.event.inputs.branch }}@${{ env.DORIS_COMMIT }}'

            - name: Deploy Branch
              if: ${{ github.event.inputs.branch != 'master' }}
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ github.token }}
                  publish_branch: asf-site
                  force_orphan: true
                  publish_dir: ./build
                  destination_dir: ${{ github.event.inputs.branch }}
                  user_name: 'github-actions[bot]'
                  user_email: 'github-actions[bot]@users.noreply.github.com'
                  commit_message: 'Automated deployment with doris branch ${{ github.event.inputs.branch }}@${{ env.DORIS_COMMIT }}'
