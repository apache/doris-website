name: Translation run

# One discovery and generation run for one managed locale. The language
# workflows own the triggers, the manual defaults and the shared whole-run
# lock; they pass the locale, the mode and the filters here.
on:
  workflow_call:
    inputs:
      locale:
        description: Managed translation locale
        type: string
        required: true
      workspace:
        description: Run directory name and artifact prefix
        type: string
        required: true
      mode:
        description: dry-run, validate or generate
        type: string
        required: true
      plugin:
        description: Optional plugin filter (default, community, course, releases, course-ui, community-report, community-report-ui)
        type: string
        default: ''
      version:
        description: Optional version filter (current or 4.x)
        type: string
        default: ''
      path:
        description: Optional repository-relative source path prefix
        type: string
        default: ''
      paths:
        description: Optional JSON array of exact English .md/.mdx/.ts/.tsx files (exclusive with path)
        type: string
        default: ''
    secrets:
      OSS_AK:
        required: false
      OSS_SK:
        required: false
      I18N_GITHUB_APP_ID:
        required: false
      I18N_GITHUB_APP_PRIVATE_KEY:
        required: false
      I18N_GITHUB_PAT:
        required: false

permissions:
  contents: read
  pull-requests: read

env:
  I18N_LOCALE: ${{ inputs.locale }}
  I18N_MODE: ${{ inputs.mode }}
  I18N_PLUGIN: ${{ inputs.plugin }}
  I18N_VERSION: ${{ inputs.version }}
  I18N_PATH: ${{ inputs.path }}
  I18N_PATHS: ${{ inputs.paths }}
  I18N_LIMIT: '20'
  I18N_MAX_PAGES: ${{ inputs.mode == 'validate' && '1' || '10' }}
  TRANSLATION_WORKSPACE: ${{ inputs.workspace }}

jobs:
  discover:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      can_generate: ${{ steps.scan.outputs.can_generate }}
      source_commit: ${{ steps.scan.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn --frozen-lockfile --ignore-scripts
      - name: Reconcile every open master PR with managed translation files
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/i18n/workflow-prs.cjs "$RUNNER_TEMP/$TRANSLATION_WORKSPACE"
      - name: Plan all current and historical pending documents
        id: scan
        run: node scripts/i18n/workflow-scan.cjs "$RUNNER_TEMP/$TRANSLATION_WORKSPACE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ inputs.workspace }}-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ inputs.workspace }}/
          if-no-files-found: warn
          retention-days: 30

  generate:
    needs: discover
    if: needs.discover.outputs.can_generate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Current master, not the discovery commit: this job can wait for a runner
      # long after discovery, and the replan below works from what it checks out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'
      - run: yarn --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.workspace }}-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ inputs.workspace }}
      - name: Check external configuration
        id: config
        env:
          HAS_OSS: ${{ secrets.OSS_AK != '' && secrets.OSS_SK != '' }}
          HAS_APP: ${{ secrets.I18N_GITHUB_APP_ID != '' && secrets.I18N_GITHUB_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.I18N_GITHUB_PAT != '' }}
        run: |
          if [[ "$HAS_APP" == 'true' ]]; then
            echo 'auth_kind=app' >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_PAT" == 'true' ]]; then
            echo 'auth_kind=pat' >> "$GITHUB_OUTPUT"
          else
            echo 'auth_kind=none' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$HAS_OSS" == 'true' && ( "$HAS_APP" == 'true' || "$HAS_PAT" == 'true' || "$I18N_MODE" == 'validate' ) ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'OSS Codex auth or a GitHub write credential is missing. No model call or PR write was attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify personal token identity before model calls
        if: steps.config.outputs.auth_kind == 'pat'
        env:
          GH_TOKEN: ${{ secrets.I18N_GITHUB_PAT }}
        run: gh api user --jq '.login' > /dev/null
      - name: Reconcile again immediately before model calls
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/i18n/workflow-prs.cjs "$RUNNER_TEMP/$TRANSLATION_WORKSPACE"
      - name: Replan exact source and open PRs
        if: steps.config.outputs.ready == 'true'
        id: fresh
        run: node scripts/i18n/workflow-scan.cjs "$RUNNER_TEMP/$TRANSLATION_WORKSPACE"
      # The publisher labels the PR only after the model calls and the branch push.
      - name: Verify the PR label before model calls
        if: steps.fresh.outputs.can_generate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/apache/doris-website/labels/translate-$I18N_LOCALE" --jq .name)" = "translate-$I18N_LOCALE"
      - name: Install ossutil for the pinned Codex package and auth pool
        if: steps.fresh.outputs.can_generate == 'true'
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          curl -fsSL -o "$temp_dir/ossutil.zip" https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          echo "dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343  $temp_dir/ossutil.zip" | sha256sum --check
          unzip -q "$temp_dir/ossutil.zip" -d "$temp_dir"
          sudo install -m 0755 "$temp_dir/ossutil-v1.7.19-linux-amd64/ossutil" /usr/local/bin/ossutil
      - name: Install the verified Codex runtime used by Doris review
        if: steps.fresh.outputs.can_generate == 'true'
        env:
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
        run: |
          archive="$RUNNER_TEMP/codex-exec-goal.tar.gz"
          package="$RUNNER_TEMP/codex-exec-goal"
          ossutil -i "$OSS_AK" -k "$OSS_SK" -e oss-cn-hongkong.aliyuncs.com \
            cp -f oss://doris-community-ci/codex/releases/codex-exec-goal-0.156.1-a310d33f7ebb-x86_64-unknown-linux-gnu.tar.gz "$archive"
          echo "2ee3073479bc8c94436684b55a13d7a3f299e768d04436d90e0427814a3954bc  $archive" | sha256sum --check
          mkdir -p "$package"
          tar -xzf "$archive" -C "$package"
          (cd "$package" && sha256sum --check SHA256SUMS)
          test "$(jq -r .version "$package/codex-package.json")" = 0.156.1
          "$package/bin/codex" exec --help | grep -q -- '--output-schema'
          "$package/bin/codex" exec --help | grep -q -- '--disable'
          "$package/bin/codex" exec --help | grep -q -- '--ignore-user-config'
          "$package/bin/codex" exec --help | grep -q -- '--ephemeral'
          echo "CODEX_BIN=$package/bin/codex" >> "$GITHUB_ENV"
      - name: Load an eligible Codex auth snapshot
        if: steps.fresh.outputs.can_generate == 'true'
        id: auth
        env:
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
        run: node scripts/i18n/codex-auth.cjs load
      - name: Generate a bounded, validated batch
        if: steps.auth.outcome == 'success'
        id: translation
        env:
          I18N_CODEX_MODEL: ${{ vars.I18N_CODEX_MODEL || 'gpt-6-sol' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/i18n/workflow-generate.cjs "$RUNNER_TEMP/$TRANSLATION_WORKSPACE"
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        if: steps.translation.outputs.created == 'true' && steps.config.outputs.auth_kind == 'app'
        id: app
        with:
          app-id: ${{ secrets.I18N_GITHUB_APP_ID }}
          private-key: ${{ secrets.I18N_GITHUB_APP_PRIVATE_KEY }}
          owner: apache
          repositories: doris-website
          permission-contents: write
          permission-pull-requests: write
      - name: Run shared PR admission checks and open reviewable PR
        if: steps.translation.outputs.created == 'true' && steps.config.outputs.auth_kind != 'none'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.I18N_GITHUB_PAT }}
          I18N_PR_AUTH_KIND: ${{ steps.config.outputs.auth_kind }}
        run: node scripts/i18n/workflow-publish.cjs "$RUNNER_TEMP/$TRANSLATION_WORKSPACE"
      - name: Report staged validation without GitHub write credentials
        if: steps.translation.outputs.created == 'true' && steps.config.outputs.auth_kind == 'none'
        run: echo 'One-page Codex candidate is in the generation artifact. A GitHub App or personal token is required for a translation PR.' >> "$GITHUB_STEP_SUMMARY"
      - name: Sync refreshed Codex auth without overwriting a newer snapshot
        if: always() && steps.auth.outcome == 'success'
        env:
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
        run: node scripts/i18n/codex-auth.cjs sync
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ inputs.workspace }}-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ inputs.workspace }}/
          if-no-files-found: warn
          retention-days: 30
