name: Docs AI Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-ai-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  authorize:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/review-docs')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
      number: ${{ steps.authorize.outputs.number }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the exact command and repository write permission
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/review.py authorize --command /review-docs

  analyze:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
      HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install only trusted dependencies without lifecycle scripts
        working-directory: trusted
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Checkout PR data in the read-only job
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          path: pr
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Analyze PR content with trusted tooling
        run: |
          git -C pr fetch --no-tags origin "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/review-result"
          node trusted/.github/scripts/docs-review.cjs "$GITHUB_WORKSPACE/pr" "$RUNNER_TEMP/review-result/review.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-ai-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-result/review.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [authorize, analyze]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ needs.authorize.outputs.number }}
      HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
      BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-ai-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-result
      - name: Validate the result and publish for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/review.py publish --kind docs --input "$RUNNER_TEMP/review-result/review.json"
