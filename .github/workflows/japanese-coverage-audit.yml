name: Japanese coverage audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'versioned_docs/version-4.x/**'
      - 'community/**'
      - 'i18n/ja/**'
      - 'translations/**'
      - 'sidebars.ts'
      - 'sidebarsCommunity.json'
      - 'versioned_sidebars/version-4.x-sidebars.json'
      - 'scripts/i18n/**'
      - '.github/workflows/japanese-coverage-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn --frozen-lockfile
      - name: Recount native scope at checked-out source SHA
        env:
          DORIS_ENABLE_JA: 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/japanese-audit"
          node scripts/i18n/audit-coverage.cjs --source-ref HEAD --output "$RUNNER_TEMP/japanese-audit/coverage.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japanese-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/japanese-audit/coverage.json
          if-no-files-found: warn
          retention-days: 30
