name: Japanese coverage audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'versioned_docs/version-4.x/**'
      - 'community/**'
      - 'i18n/ja/**'
      - 'translations/config.json'
      - 'translations/inventory/ja/**'
      - 'translations/scope/ja.json'
      - 'translations/glossary/ja.json'
      - 'translations/state/ja/**'
      - 'translations/protection-exceptions/ja.json'
      - 'docusaurus.config.js'
      - 'versions.json'
      - 'config/i18n.js'
      - 'config/versions-plugin.js'
      - 'sidebars.ts'
      - 'sidebarsCommunity.json'
      - 'versioned_sidebars/version-4.x-sidebars.json'
      - 'scripts/i18n/**'
      - '.github/workflows/japanese-coverage-audit.yml'

permissions:
  contents: read

concurrency:
  group: japanese-coverage-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Japanese coverage audit
    env:
      I18N_LOCALE: ja
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The audit only reads HEAD; its git comparisons never need history.
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn --frozen-lockfile
      - name: Recount native scope at checked-out source SHA
        run: |
          mkdir -p "$RUNNER_TEMP/japanese-audit"
          node scripts/i18n/audit-coverage.cjs --source-ref HEAD --output "$RUNNER_TEMP/japanese-audit/coverage.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: japanese-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/japanese-audit/coverage.json
          if-no-files-found: warn
          retention-days: 30
