name: Japanese coverage audit

# Full coverage is a maintenance report; Build Check validates pull requests.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: japanese-coverage-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Japanese coverage audit
    env:
      I18N_LOCALE: ja
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Release-note eligibility follows the fixed cutoff and Git lineage.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn --frozen-lockfile
      - name: Recount native scope at checked-out source SHA
        run: |
          mkdir -p "$RUNNER_TEMP/japanese-audit"
          node scripts/i18n/audit-coverage.cjs --source-ref HEAD --output "$RUNNER_TEMP/japanese-audit/coverage.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: japanese-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/japanese-audit/coverage.json
          if-no-files-found: warn
          retention-days: 30
