name: Check Markdown Links

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: check-md-links-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-md-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          # The changed-file lists and link targets need trees and the working
          # tree only; skip the historical blobs of this ~1.7GB repository.
          filter: blob:none

      - name: Collect added/modified Markdown files
        id: changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Check added/modified files and rename destinations across all
          # content plugins, versions and locales; deleted files are skipped.
          # github.event.pull_request.base.sha is the base branch tip from when the PR was opened,
          # not the current one, so diffing against it drags in every commit that landed on the base
          # branch since then. Resolve the merge base against the base branch as it is now: the
          # checkout is refs/pull/<n>/merge, so this leaves exactly the PR's own changes.
          BASE_SHA="$(git merge-base "origin/$BASE_REF" HEAD)"
          echo "Diffing against origin/$BASE_REF ($BASE_SHA)"
          git diff --name-only --diff-filter=AMR -z \
              "$BASE_SHA" HEAD \
              -- ':(glob)docs/**/*.md' ':(glob)docs/**/*.mdx' \
                 ':(glob)versioned_docs/**/*.md' ':(glob)versioned_docs/**/*.mdx' \
                 ':(glob)i18n/**/*.md' ':(glob)i18n/**/*.mdx' \
                 ':(glob)community/**/*.md' ':(glob)community/**/*.mdx' \
                 ':(glob)course/**/*.md' ':(glob)course/**/*.mdx' \
                 ':(glob)releasenotes/**/*.md' ':(glob)releasenotes/**/*.mdx' \
                 ':(glob)blog/**/*.md' ':(glob)blog/**/*.mdx' > "$RUNNER_TEMP/pr-markdown-files"
          if [ -s "$RUNNER_TEMP/pr-markdown-files" ]; then
            echo 'has_files=true' >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'scripts<<EOF'
            git diff --name-only "$BASE_SHA" HEAD \
              -- 'scripts/check_md_links_single.py' 'scripts/__tests__/test_japanese_links.py'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.changed.outputs.has_files == 'true' || steps.changed.outputs.scripts != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify Japanese source fallback resolver
        if: steps.changed.outputs.scripts != ''
        run: python3 -m unittest scripts/__tests__/test_japanese_links.py

      - name: Check links in changed Markdown files
        if: steps.changed.outputs.has_files == 'true'
        run: |
          set -u
          FAILED=()
          while IFS= read -r -d '' file; do
            [ -z "$file" ] && continue
            if [ ! -f "$file" ]; then
              echo "Skip (not found in working tree): $file"
              continue
            fi
            echo
            echo "=== Checking: $file ==="
            if ! python3 scripts/check_md_links_single.py "$file" --no-external; then
              FAILED+=("$file")
            fi
          done < "$RUNNER_TEMP/pr-markdown-files"

          echo
          echo "============================================================"
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "❌ Broken internal links found in ${#FAILED[@]} file(s):"
            for f in "${FAILED[@]}"; do
              echo "   - $f"
            done
            exit 1
          fi
          echo "✅ All checked Markdown files have valid internal links."
