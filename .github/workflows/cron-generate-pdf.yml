name: Cron Generate Pdf

on: 
  schedule:
    - cron: '0 12,18,1 * * *'


permissions:
  contents: read

concurrency:
  group: production-pdf
  cancel-in-progress: false

jobs:
  source:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      branch: ${{ steps.source.outputs.branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve a protected branch to an immutable commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_BRANCH: master
        run: python3 .github/scripts/review.py deploy-ref

  build:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.source_sha }}

    - name: Use Node.js
      uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
      with:
        node-version: 20

    - name: Generate PDF
      run: |
        npx --yes vitpress-generate-pdf@1.1.4 --initialDocURLs="https://doris.apache.org/docs/dev/getting-started/intro" --paginationSelector=".pagination-nav__link--next" --contentSelector="article" --coverImage="https://cdn.selectdb.com/static/doris_logo_512_4903556647.png" --coverTitle="Apache Doris Docs (English)" --outputPDFFilename="Apache Doris Docs (English).pdf" --tocOnlyH1=true
        npx --yes vitpress-generate-pdf@1.1.4 --initialDocURLs="https://doris.apache.org/zh-CN/docs/dev/getting-started/intro" --paginationSelector=".pagination-nav__link--next" --contentSelector="article" --coverImage="https://cdn.selectdb.com/static/doris_logo_512_4903556647.png" --coverTitle="Apache Doris Docs (中文)" --outputPDFFilename="Apache Doris Docs (中文).pdf" --tocOnlyH1=true
        mkdir -p ./build-pdf/assets/files/
        cp -- ./*.pdf ./build-pdf/assets/files/
        ls ./build-pdf/assets/files/
    - name: Upload the site artifact for the isolated deployment job
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: site-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: build-pdf
        include-hidden-files: true
        compression-level: 0
        if-no-files-found: error
        retention-days: 1

  deploy:
    needs: [source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: Production
    permissions:
      contents: read
    env:
      DORIS_COMMIT: ${{ needs.source.outputs.source_sha }}
    steps:
      - name: Checkout trusted deployment code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-pdf
      - name: Upload files to OSS
        uses: ./.github/actions/aliyun-oss-website-action
        with:
            accessKeyId: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
            accessKeySecret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
            bucket: ${{ secrets.ALIYUN_OSS_BUCKET }}
            # Transfer-acceleration endpoint, same as the website deploys.
            endpoint: oss-accelerate.aliyuncs.com
            folder: build-pdf
            onlyUpload: true
            skipSetting: true
