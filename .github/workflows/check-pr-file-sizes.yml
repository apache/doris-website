name: Check PR File Sizes

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: check-file-sizes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-file-sizes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch base commit
        # Only the base tree is needed for `git diff --name-only`; its blobs
        # would otherwise re-download the whole repository at the base commit.
        run: git fetch --depth=1 --filter=blob:none origin ${{ github.event.pull_request.base.sha }}

      - name: Get changed files in PR
        id: changed
        run: |
          # Get list of files changed in the PR compared to base branch
          # Use delimiter syntax for multi-line output
          {
            echo 'files<<EOF'
            git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD | head -100
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Check file sizes
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          MAX_SIZE=1024000  # 500KB in bytes
          OVER_LIMIT=()

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # Auto-generated last-update timestamp map (scripts/last-update/):
            # legitimately large and regenerated by tooling, not a hand-committed
            # asset — exclude it from the size limit.
            [ "$file" = "scripts/last-update/data.json" ] && continue
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
              if [ "$size" -gt "$MAX_SIZE" ]; then
                size_kb=$((size / 1024))
                OVER_LIMIT+=("❌ $file (${size_kb}KB)")
              fi
            fi
          done <<< "$FILES"

          if [ ${#OVER_LIMIT[@]} -gt 0 ]; then
            echo "❌ The following files exceed 500KB:"
            for f in "${OVER_LIMIT[@]}"; do
              echo "  $f"
            done
            echo ""
            echo "Please reduce file sizes or use Git LFS to store large files."
            exit 1
          fi

          echo "✅ All files are under 500KB"
